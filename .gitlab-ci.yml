darwin_flecsi-sp-lib_test_legion:
  stage: legion
  extends: [.ascgit_job, .darwin_job, .darwin_regular_job, .build_and_test]
  needs: []
  variables:
    SPACK_ENV_NAME: "legion/openmpi-gnu"
